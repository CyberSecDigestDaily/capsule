name: Daily capsule price check

on:
  schedule:
    # Fallback only. The on-time trigger is the Cloudflare Worker in cloudflare/ (07:15, 13:15,
    # 19:15 UK), which calls workflow_dispatch. GitHub's own cron often fires hours late, so these
    # runs exit early when the data is under 4 hours old (SKIP_IF_FRESH_HOURS below).
    - cron: "23 5 * * *"
    - cron: "23 11 * * *"
    - cron: "23 17 * * *"
  push:
    branches: [main]
    # Editing the watch list / rules re-checks immediately. Data commits (docs/) don't retrigger.
    paths: ["items.json", "finder.json", "picks.json", "wardrobe.json", "scraper.py", ".github/workflows/update.yml"]
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: capsule-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main } # latest main, so a queued run sees the previous run's data (no double Drop email)

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Check prices, stock and deals
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Daily Drop email with photos, sent over Gmail SMTP (optional; without these Claude's review sends it)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DROP_TO: ${{ secrets.DROP_TO }}
          SKIP_IF_FRESH_HOURS: ${{ github.event_name == 'schedule' && '4' || '' }}
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/finds.json docs/drop.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Price/stock update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Rebase onto anything pushed meanwhile (Claude's weekly review, manual edits).
          git pull --rebase --autostash origin main
          git push

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -H "Content-Type: application/json" \
              -d "{\"content\":\"🔴 **Capsule price check FAILED** — https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$DISCORD_WEBHOOK" || true
          fi
